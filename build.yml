name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 1) إذا رُفع ملف update.zip يُفك في مكانه الصحيح ثم يُحذف
      # 2) مفتاح توقيع ثابت يُنشأ مرة واحدة ليبقى التحديث فوق النسخة القديمة بدون فقدان البيانات
      - name: Apply update.zip and signing key
        run: |
          git config user.name "alum-glass-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f update.zip ]; then
            unzip -o -q update.zip -x ".github/*" "__MACOSX/*"
            rm -f update.zip
          fi
          if [ ! -f signing/release.jks ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.jks -storepass alumglass -keypass alumglass \
              -alias alumglass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Alum Glass"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply update"
            git push origin HEAD:main
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.alumglass --project-name alum_glass .

      - name: Patch app name and signing
        run: python3 tool/patch_android.py

      - name: Signing config
        run: |
          printf "storePassword=alumglass\nkeyPassword=alumglass\nkeyAlias=alumglass\nstoreFile=%s\n" \
            "$GITHUB_WORKSPACE/signing/release.jks" > android/key.properties

      - run: flutter pub get

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: alum-glass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
