name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.alumglass --project-name alum_glass .
      - name: Patch app name and signing
        run: python3 tool/patch_android.py
      - name: Setup signing key (if provided)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
              "$KS_PASS" "$KS_PASS" "$KS_ALIAS" "$GITHUB_WORKSPACE/release.jks" > android/key.properties
          else
            echo "::warning::لا يوجد مفتاح توقيع. سيُستخدم مفتاح تجريبي ولن يُحدّث APK فوق نسخة موقعة بمفتاح مختلف."
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alum-glass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
